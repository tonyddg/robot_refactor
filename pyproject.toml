[project]
name = "robot-refactor"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tonyddg", email = "799052200@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pin>=4.1.0",
    "transforms3d>=0.4.2",
    "tyro>=1.0.15",
]

[project.scripts]
robot-test = "robot_refactor:main"

[project.optional-dependencies]
meshcat = [
    "meshcat>=0.3.2",
]
sapien = [
    "sapien>=3.0.3; platform_machine == 'x86_64'",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
